name: Publish
on:
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io/nile-quran-community
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ github.token }}
  IMAGE_NAME: nile-quran-django
  LICENSE_SPDX: GPL-3.0-or-later
jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup Python
        run: uv venv -p 3.13 .venv

      - name: Install setuptools-scm
        run: |-
          source .venv/bin/activate
          uv pip install setuptools-scm

      - id: check
        name: Check release version and commit
        env:
          GH_DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
        run: |
          source .venv/bin/activate

          echo "::group::Check tag commit matches latest commit on main"
          MAIN_SHA="$(git rev-parse --verify origin/${GH_DEFAULT_BRANCH})"
          if [ "${MAIN_SHA}" != "${GITHUB_SHA}" ]; then
            echo "::error title=Commit mismatch::Latest commit on ${GH_DEFAULT_BRANCH} (${MAIN_SHA}) does not match tag commit (${GITHUB_SHA})"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Check project version matches tag"
          PACKAGE_VERSION="$(python -m setuptools_scm)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error title=Version mismatch::Package version (${PACKAGE_VERSION}) does not match tag version (${TAG_VERSION})"
            exit 1
          fi
          echo "::endgroup::"

          echo "version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    runs-on: ${{ case(startsWith(matrix.arch, 'arm'), 'ubuntu-26.04-arm', 'ubuntu-26.04') }}
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: build
        name: Build image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          containerfiles: Dockerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.VERSION }}-${{ matrix.arch }}
          build-args: |-
            SOURCE_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ env.VERSION }}
            LICENSE=${{ env.LICENSE_SPDX }}

      - id: archive-image
        name: Export image to archive
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          buildah push "${IMAGE_NAME}:${VERSION}-${ARCH}" "oci-archive:${IMAGE_NAME}-${VERSION}-${ARCH}.tar"

      - id: upload-artifact
        name: Upload image archive as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.VERSION }}-${{ matrix.arch }}
          path: ${{ env.IMAGE_NAME }}-${{ env.VERSION }}-${{ matrix.arch }}.tar
          retention-days: 1

  push:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    environment:
      name: ghcr
      url: https://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - id: download-artifact
        name: Download image archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - id: load-images
        name: Load images from archives
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "::group::Creating image manifests"
          buildah manifest create "${IMAGE_NAME}:${VERSION}"
          buildah manifest create "${IMAGE_NAME}:latest"
          echo "::endgroup::"

          echo "::group::Adding archives to manifests"
          while read -r archive; do
            buildah manifest add --all "${IMAGE_NAME}:${VERSION}" "oci-archive:${archive}"
            buildah manifest add --all "${IMAGE_NAME}:latest" "oci-archive:${archive}"
          done < <(find . -name "${IMAGE_NAME}-${VERSION}-*.tar" -type f)
          echo "::endgroup::"

      - id: login
        name: Login to registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - id: push
        name: Push image to registry
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.VERSION }} latest
          extra-args: |-
            --compression-format
            zstd
            --compression-level
            20

      - id: attest
        name: Generate image attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [prepare, push]
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://nile-quran-community.com
    env:
      NEW_IMAGE_TAG: "${{ needs.prepare.outputs.version }}@${{ needs.push.outputs.digest }}"
    steps:
      - id: app-token
        name: Create semantic release app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          repositories: nile-quran-community/infra
          client-id: "${{ vars.SEMANTIC_RELEASE_APP_CLIENT_ID }}"
          private-key: "${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}"

      - name: Configure Git CLI
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          SEMANTIC_RELEASE_APP_SLUG: "${{ steps.app-token.outputs.app-slug }}"
        run: |
          export SEMANTIC_RELEASE_APP_UID="$(gh api "/users/${SEMANTIC_RELEASE_APP_SLUG}[bot]" --jq .id)"
          git config --global user.name "${SEMANTIC_RELEASE_APP_SLUG}[bot]"
          git config --global user.email "${SEMANTIC_RELEASE_APP_UID}+${SEMANTIC_RELEASE_APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nile-quran-community/infra
          token: "${{ steps.app-token.outputs.token }}"

      - name: Update deployed backend image
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.5.3
        env:
          KUSTOMIZATION_DIR: cluster/apps/nile-quran-community
        with:
          cmd: |
            cd '${{ env.KUSTOMIZATION_DIR }}'
            yq -i '.images[.images[] | select(.name == "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}") | path | .[-1]].newTag = "${{ env.NEW_IMAGE_TAG }}"' kustomization.yaml

      - name: Commit and push
        run: |
          echo "Diff:"
          git diff --stat
          git add cluster/apps/nile-quran-community/kustomization.yaml
          git commit -m 'chore(cluster/nqc): bump backend version to ${{ env.NEW_IMAGE_TAG }}'
          git push origin main
