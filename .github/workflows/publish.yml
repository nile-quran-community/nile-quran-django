name: Publish
on:
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io/nile-quran-community
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ github.token }}
  IMAGE_NAME: nile-quran-django
  IMAGE_PLATFORMS: linux/amd64,linux/arm64
  LICENSE_SPDX: GPL-3.0-or-later
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup Python
        run: uv venv -p 3.13 .venv

      - name: Install setuptools-scm
        run: |-
          source .venv/bin/activate
          uv pip install setuptools-scm

      - id: check
        name: Check release version and commit
        run: |
          source .venv/bin/activate
          echo "::group::Check tag commit matches latest commit on main"
          MAIN_SHA="$(git rev-parse --verify origin/main)"
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "::error title=Commit mismatch::Latest commit on main ($MAIN_SHA) does not match tag commit ($GITHUB_SHA)"
            exit 1
          fi
          echo "::endgroup::"
          echo "::group::Check project version matches tag"
          PACKAGE_VERSION="$(python -m setuptools_scm)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error title=Version mismatch::Package version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: ghcr
      url: https://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: install
        name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-static

      - id: build
        name: Build image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          containerfiles: Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.VERSION }} latest
          build-args: |-
            SOURCE_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ env.VERSION }}
            LICENSE=${{ env.LICENSE_SPDX }}

      - id: login
        name: Login to registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - id: push
        name: Push image to registry
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          extra-args: |-
            --compression-format
            zstd
            --compression-level
            20

      - id: attest
        name: Generate image attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nile-quran-community.com
    env:
      NEW_IMAGE_TAG: "${{ needs.prepare.outputs.version }}@${{ needs.build.outputs.digest }}"
    steps:
      - id: app-token
        name: Create semantic release app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          repositories: nile-quran-community/infra
          client-id: "${{ vars.SEMANTIC_RELEASE_APP_CLIENT_ID }}"
          private-key: "${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}"

      - name: Configure Git CLI
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          SEMANTIC_RELEASE_APP_SLUG: "${{ steps.app-token.outputs.app-slug }}"
        run: |
          export SEMANTIC_RELEASE_APP_UID="$(gh api "/users/${SEMANTIC_RELEASE_APP_SLUG}[bot]" --jq .id)"
          git config --global user.name "${SEMANTIC_RELEASE_APP_SLUG}[bot]"
          git config --global user.email "${SEMANTIC_RELEASE_APP_UID}+${SEMANTIC_RELEASE_APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nile-quran-community/infra
          token: "${{ steps.app-token.outputs.token }}"

      - name: Update deployed backend image
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.5.3
        env:
          KUSTOMIZATION_DIR: cluster/apps/nile-quran-community
        with:
          cmd: |
            cd '${{ env.KUSTOMIZATION_DIR }}'
            yq -i '.images[.images[] | select(.name == "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}") | path | .[-1]].newTag = "${{ env.NEW_IMAGE_TAG }}"' kustomization.yaml

      - name: Commit and push
        run: |
          echo "Diff:"
          git diff --stat
          git add cluster/apps/nile-quran-community/kustomization.yaml
          git commit -m 'chore(cluster/nqc): bump backend version to ${{ env.NEW_IMAGE_TAG }}'
          git push origin main
