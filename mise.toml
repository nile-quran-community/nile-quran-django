[settings]
lockfile = true
all_compile = false

[tools]
# NOTE: Python
python = "3.13"
uv = "0.13"
# NOTE: Formatter and linters
ruff = "0.17"
oxfmt = "0.78"
tombi = "1"
# NOTE: Utils
prek = "0.5"

[env]
_.python.venv = { create = true, path = ".venv" }
PYTHONPATH = "{{ config_root }}/src"
DJANGO_SETTINGS_MODULE = "nile_quran_community_api.settings"
DATABASE_URL = "sqlite:///{{ config_root }}/dev.sqlite"

[tasks.install]
description = "Install dependencies"
alias = "i"
run = ["mise install", "uv sync --all-groups --all-extras", "prek install"]

[tasks.migrate]
description = "Run database migrations"
alias = "m"
run = '''
django-admin makemigrations
django-admin migrate
django-admin setuproles
'''

[tasks.devserver]
description = "Run development server"
depends = ["migrate"]
alias = "dev"
run = '''
django-admin runserver
'''

[tasks.test]
description = "Run unit tests"
alias = "t"
run = "pytest"

[tasks.hooks]
description = "Run all pre-commit hooks"
alias = "h"
run = "prek run -a"
